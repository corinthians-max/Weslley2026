<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuários</title>
    <style>
        .texto { color: red; }
        .campo { border: 1px solid red; padding: 5px; margin-bottom: 10px; }
        fieldset { border: 1px solid red; background-color: yellow; padding: 20px; }
        legend { color: red; font-weight: bold; }
        .botao { background-color: green; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        body { background-color: pink; font-family: Arial, sans-serif; }
        #mensagem { font-weight: bold; margin-top: 15px; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // IMPORTANTE: Substitua pelas suas credenciais reais do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "weslley-kloss.firebaseapp.com",
            projectId: "weslley-kloss",
            storageBucket: "weslley-kloss.firebasestorage.app",
            messagingSenderId: "963200292639",
            appId: "1:963200292639:web:1f73dd6f8a97732091022a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("formulario").addEventListener("submit", async (e) => {
            e.preventDefault();
            const mensagem = document.getElementById("mensagem");
            
            const dados = {
                nome: document.getElementById("nome").value,
                cep: document.getElementById("cep").value,
                cpf: document.getElementById("cpf").value,
                data_nascimento: document.getElementById("data_nascimento").value,
                email: document.getElementById("email").value,
                foto: document.getElementById("foto").value,
                idade: document.getElementById("idade").value,
                rg: document.getElementById("rg").value,
                senha: document.getElementById("senha").value,
                telefone: document.getElementById("telefone").value
            };

            try {
                await addDoc(collection(db, "usuarios"), dados);
                mensagem.textContent = "Usuário salvo com sucesso.";
                mensagem.style.color = "green";
                document.getElementById("formulario").reset();
            } catch (error) {
                mensagem.textContent = "Erro ao salvar: " + error.message;
                mensagem.style.color = "red";
            }
        });
    </script>
</head>
<body>
    <form id="formulario">
        <fieldset>
            <legend>CADASTRO DE USUÁRIOS</legend>
            
            <p class="texto">NOME COMPLETO:</p>
            <input type="text" id="nome" class="campo" placeholder="Digite seu nome" required><br>
            
            <p class="texto">CEP:</p>
            <input type="text" id="cep" class="campo" placeholder="00000-000" required><br>
            
            <p class="texto">CPF:</p>
            <input type="text" id="cpf" class="campo" placeholder="000.000.000-00" required><br>
            
            <p class="texto">DATA DE NASCIMENTO:</p>
            <input type="date" id="data_nascimento" class="campo" required><br>
            
            <p class="texto">EMAIL:</p>
            <input type="email" id="email" class="campo" placeholder="seu@email.com" required><br>
            
            <p class="texto">FOTO (URL):</p>
            <input type="url" id="foto" class="campo" placeholder="http://..." required><br>
            
            <p class="texto">IDADE:</p>
            <input type="number" id="idade" class="campo" placeholder="Sua idade" min="0" required><br>
            
            <p class="texto">RG:</p>
            <input type="text" id="rg" class="campo" placeholder="Seu RG" required><br>
            
            <p class="texto">SENHA:</p>
            <input type="password" id="senha" class="campo" placeholder="Sua senha" required><br>
            
            <p class="texto">TELEFONE:</p>
            <input type="tel" id="telefone" class="campo" placeholder="(00) 00000-0000" required><br>
            
            <input type="submit" value="Cadastrar" class="botao">
            <div id="snack"></div>
            <p id="mensagem"></p>
        </fieldset>
    </form>
</body>
</html>

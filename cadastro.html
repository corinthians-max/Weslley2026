<!DOCTYPE html>
<html lang="PT-BR">
    <head> 
        <style>
            .texto{
                color:white;
            }
            .campo{
                 border:1px solid white;
                
            }
            fieldset{
                border:1px solid white;
                background-color:black;
            }
            legend{
                color:white;
            }
            .botao{
                background-color: white;
                color: white;
            }
            body{
                background-color: black;
            }
        </style>
        <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDf8ecZQHIRd736_MO4rrqC7Iy7RUWtjo",
  authDomain: "weslley-kloss.firebaseapp.com",
  projectId: "weslley-kloss",
  storageBucket: "weslley-kloss.firebasestorage.app",
  messagingSenderId: "963200292639",
  appId: "1:963200292639:web:1f73dd6f8a97732091022a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const cep = document.getElementById("cep").value;
      const cpf = document.getElementById("cpf").value;
      const data_de_nascimento = document.getElementById("data_de_nascimento").value;
      const email = document.getElementById("email").value;
      const foto = document.getElementById("foto").value;
      const idade = document.getElementById("idade").value;
      const rg = document.getElementById("rg").value;
      const senha = document.getElementById("senha").value;
      const telefone = document.getElementById("telefone").value;

      try {
        await addDoc(collection(db, "usuarios"), {
          nome,
          cep,
          cpf,
          data_de_nascimento,
          email,
          foto,
          idade,
          rg,
          senha,
          telefone
          
        });

        mensagem.textContent = "Usuário salvo com sucesso.";
        mensagem.style.color = "green";
        form.reset();
      } catch (error) {
        mensagem.textContent = "Erro ao salvar: " + error.message;
        mensagem.style.color = "red";
      }
    });
  </script>
    </head>
    <body>
      <form id="formulario">
         <fieldset>
           <legend>CADASTRO DE USUARIOS</legend>
            <p class="texto">Nome Completo: </p><input type ="text" id="nome" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">CEP:</p><input type ="text"  id="cep" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">CPF:</p><input type ="text" id="cpf" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Data de Nascimento:</p><input type ="text"  id="data_de_nascimento" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Email:</p><input type ="text"  id="email" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Foto:</p><input type ="text" id="foto" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Idade:</p><input type ="text"  id="idade" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">RG:</p><input type ="text" id="rg" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Senha:</p><input type ="text" id="senha" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <p class="texto">Telefone:</p><input type ="text" id="telefone" class="campo" placeholder="Nome do Usuario" minlength="10" maxlengh="20" id="nome"  class="nome" name="nome" required><br>
            <input type="submit" value="Cadastrar">
         </fieldset> 
      </form>
    </body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }
        /* Estilização das Abas */
        .tabs {
            display: flex;
            background-color: #e9e9e9;
            border-bottom: 1px solid #ccc;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border-right: 1px solid #ccc;
            background: #e9e9e9;
            font-size: 12px;
            white-space: nowrap;
        }
        .tab.active {
            background: #fff;
            border-bottom: 1px solid transparent;
            font-weight: bold;
        }
        /* Conteúdo do Formulário */
        .form-content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }
        .field.small { flex: 0 0 100px; }
        .field.medium { flex: 0 0 200px; }
        .field.large { flex: 2; }
        
        label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
        }
        .row {
            display: flex;
            gap: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Barra de Navegação por Abas -->
    <div class="tabs">
        <div class="tab active">Endereço</div>
        <div class="tab">Salário</div>
        <div class="tab">Documentos</div>
        <div class="tab">Departamentos</div>
        <div class="tab">Pessoal</div>
        <div class="tab">CNH e MOPP</div>
        <div class="tab">Outros</div>
        <div class="tab">Serviços</div>
        <div class="tab">Despesas</div>
        <div class="tab">Jornada</div>
        <div class="tab">Eventos</div>
    </div>

    <!-- Conteúdo da Aba Endereço -->
    <form class="form-content">
        
        <div class="form-group">
            <div class="field small">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep">
            </div>
        </div>

        <div class="form-group">
            <div class="field large">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco">
            </div>
        </div>

        <div class="form-group">
            <div class="field large">
                <label for="complemento-end">Complemento:</label>
                <input type="text" id="complemento-end" name="complemento-end">
            </div>
            <div class="field medium">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro">
            </div>
        </div>

        <div class="form-group">
            <div class="field small">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade">
            </div>
            <div class="field small">
                <label for="uf">UF:</label>
                <select id="uf" name="uf">
                    <option value="SP" selected>SP</option>
                    <!-- Adicione outras opções se necessário -->
                </select>
            </div>
        </div>

        <div class="form-group">
            <div class="field medium">
                <label for="telefone1">Telefone 1:</label>
                <div class="row">
                    <input type="text" id="ddd1" style="width: 40px;" placeholder="DDD">
                    <input type="text" id="telefone1" style="flex: 1;">
                </div>
            </div>
            <div class="field large">
                <label for="compl1">Complemento:</label>
                <input type="text" id="compl1" name="compl1">
            </div>
        </div>

        <div class="form-group">
            <div class="field medium">
                <label for="telefone2">Telefone 2:</label>
                <div class="row">
                    <input type="text" id="ddd2" style="width: 40px;" placeholder="DDD">
                    <input type="text" id="telefone2" style="flex: 1;">
                </div>
            </div>
            <div class="field large">
                <label for="compl2">Complemento:</label>
                <input type="text" id="compl2" name="compl2">
            </div>
        </div>

        <div class="form-group">
            <div class="field medium">
                <label for="celular">Celular:</label>
                <div class="row">
                    <input type="text" id="ddd-cel" style="width: 40px;" placeholder="DDD">
                    <input type="text" id="celular" style="flex: 1;">
                </div>
            </div>
            <div class="field large">
                <label for="compl-cel">Complemento:</label>
                <input type="text" id="compl-cel" name="compl-cel">
            </div>
        </div>

        <div class="form-group">
            <div class="field medium">
                <label for="fax">Fax:</label>
                <div class="row">
                    <input type="text" id="ddd-fax" style="width: 40px;" placeholder="DDD">
                    <input type="text" id="fax" style="flex: 1;">
                </div>
            </div>
            <div class="field large">
                <label for="compl-fax">Complemento:</label>
                <input type="text" id="compl-fax" name="compl-fax">
            </div>
        </div>

    </form>
</div>

</body>
</html>
